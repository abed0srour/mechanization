<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — السجل البلدي</title>
    <!--
      Deliberately self-contained: no font, no stylesheet, no script. This page
      is only ever served when the network is gone, so anything it referenced
      would be one more thing to fail — and a broken error page is worse than a
      plain one. The system font stack renders Arabic correctly on every device
      this portal runs on.

      No script tag, and — the mistake the first version of this page made —
      no inline event handler either. This page is served through the same
      middleware as every other route, so it carries the same Content-Security-
      Policy: a per-request nonce plus `strict-dynamic`, with no `unsafe-inline`
      fallback. An `onclick="…"` attribute is exactly as blocked as a `<script>`
      tag under that policy, and a cached static file can never carry a nonce
      that matches whatever the policy generates for a future request. Both
      controls below are therefore plain `<a href>` elements — a link the
      browser navigates on its own needs no script's permission to run.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
        line-height: 1.7;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #090e17; color: #e2e8f0; }
        .card { background: #0f172a; border-color: #1e293b; }
        .note { background: #1e293b; }
        .secondary { border-color: #1e293b; color: #e2e8f0; }
      }
      .card {
        max-width: 30rem;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; font-size: 0.875rem; }
      .note {
        background: #f1f5f9;
        border-radius: 0.5rem;
        padding: 0.75rem;
        font-size: 0.8125rem;
        text-align: start;
      }
      .actions { margin-top: 1rem; display: grid; gap: 0.5rem; }
      .primary, .secondary {
        display: block;
        padding: 0.625rem 1rem;
        font-weight: 600;
        border-radius: 0.5rem;
        text-decoration: none;
      }
      .primary { color: #ffffff; background: #1d4ed8; }
      .secondary { color: #0f172a; background: transparent; border: 1px solid #e2e8f0; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>لا يوجد اتصال بالشبكة</h1>
      <p>هذه الصفحة لم تُفتح على هذا الجهاز من قبل، فلا نسخة محفوظة منها.</p>

      <!--
        The reassurance is the point of this page. An officer who has just been
        shown an error screen has every reason to assume the afternoon's work
        went with it, and the expensive mistake that follows is re-entering
        households that are already stored.
      -->
      <div class="note">
        <strong>السجلات المحفوظة على هذا الجهاز لم تُفقد.</strong>
        تبقى مخزّنة كما هي، وتُرسل تلقائياً إلى البلدية عند عودة الشبكة. لا حاجة
        لإعادة إدخال أي منها.
      </div>

      <div class="actions">
        <!--
          Placeholders, not real paths — this file is one static asset shared
          by every municipality, cached once, with no way to know here which
          tenant a future stranded visit will belong to. The service worker
          rewrites both before this page is ever shown; see `offlinePageFor`
          in sw.js. Left unresolved only if that rewrite could not determine a
          tenant at all, which the two lines below still fail toward safely —
          a dead link, not a broken page.
        -->
        <a class="primary" href="__CITIZENS_NEW__">تسجيل مواطن جديد</a>
        <a class="secondary" href="__CITIZENS_LIST__">سجل المواطنين وقائمة الانتظار</a>
      </div>

      <!--
        An empty `href` is a link to the current document's own URL — the
        browser navigates there and re-runs exactly the request that landed on
        this page, without a script asking it to. That re-attempt is what
        "إعادة المحاولة" means here: try reaching the page this was actually
        supposed to be, not just reload this fallback.
      -->
      <p style="margin-top: 0.75rem">
        <a href="">إعادة المحاولة</a>
      </p>
    </main>
  </body>
</html>
