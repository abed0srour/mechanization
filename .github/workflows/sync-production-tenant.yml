name: Sync tenant to production

on:
  workflow_dispatch:
    inputs:
      confirm_ref:
        description: 'Type the production project ref to confirm (thbgwfbcqdougbjvgvyw)'
        required: true
        type: string
      dry_run:
        description: 'Report what would be copied, change nothing'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sync:
    name: sync tenant to production
    runs-on: ubuntu-latest
    environment: db-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run sync
        env:
          CONFIRM_REF: ${{ inputs.confirm_ref }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: |
          node scripts/db/sync-production-tenant.mjs \
            --confirm="$CONFIRM_REF" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
